<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesys Cloud Tools</title>
  <link rel="stylesheet" href="src/styles.css">
  <style>
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
    @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }
    .tool-card { border: 1.5px solid #dee2e6; border-radius: 8px; padding: 24px; text-decoration: none; color: inherit; display: block; transition: box-shadow .2s, border-color .2s; }
    .tool-card:hover { border-color: #0066cc; box-shadow: 0 4px 12px rgba(0,102,204,.15); }
    .tool-card h2 { font-size: 18px; margin-bottom: 8px; color: #0066cc; }
    .tool-card p  { font-size: 14px; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>&#x1F9F0; Genesys Cloud Tools</h1>
    <div class="card-grid">
      <a class="tool-card" href="pkce.html">
        <h2>&#x1F510; PKCE API Tester</h2>
        <p>Authenticate via OAuth 2.0 PKCE flow and call any Genesys Cloud Platform API endpoint interactively.</p>
      </a>
      <a class="tool-card" href="framework.html">
        <h2>&#x1F4BB; Embedded Framework</h2>
        <p>Embed the Genesys Cloud agent softphone (Embeddable Framework) in development or production mode.</p>
      </a>
    </div>
  </div>
</body>
</html>
